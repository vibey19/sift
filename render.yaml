# The audit API, deployed on its own.
#
# It used to be a serverless function beside the frontend. pandas, numpy, scipy
# and scikit-learn come to about 300MB installed, which is over the bundle limit
# a function is allowed, and no amount of excluding project files closes a gap
# that is entirely dependencies. A plain server has no such limit.
#
# Two things came free with the move: requests are no longer capped at the 4.5MB
# a serverless request body allows, and the audit is no longer racing a function
# timeout.
services:
  - type: web
    name: sift-api
    runtime: python
    # Not free. Free was tried and does not work, and the reason is worth
    # writing down because the memory figures suggested it would: peak resident
    # memory is 305MB auditing 50,000 rows against the 512MB a free instance
    # has, which looked like enough headroom.
    #
    # What that number missed is the CPU. A free instance gets 0.1 of one, and
    # this workload is a cross-validated model plus a decision tree per column.
    # Measured against the live service on the 3,075 row sample: 24 seconds
    # without a label column and 40 with one, where the same audit takes 1.5 and
    # 2.8 seconds on a laptop. Fifteen times slower, and the instance then died
    # and restarted rather than serving the next request.
    #
    # Standard is 1 CPU and 2GB, which is ten times the CPU and four times the
    # memory. Starter would fix the speed and not the crash, since it has the
    # same 512MB.
    plan: standard
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    # One worker on purpose. The audit is CPU-bound and holds the whole frame in
    # memory; a second worker doubles the memory for no more throughput.
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      # Narrow this to the deployed frontend once it has a URL. See api/index.py
      # for why the default is not the hole it appears to be.
      - key: SIFT_ALLOWED_ORIGINS
        value: "*"
