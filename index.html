<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sift: clean a messy CSV without the notebook</title>
    <meta
      name="description"
      content="Drop in a CSV. Sift runs fifteen checks, fixes the unambiguous problems in one click, and hands you the rest with row numbers and a reason. Nothing is stored."
    />
    <meta property="og:title" content="Sift: clean a messy CSV without the notebook" />
    <meta
      property="og:description"
      content="Fifteen checks, one-click fixes for the tedious half, and the leaked columns and contaminated splits a quick pass would miss."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      // Inline and before paint on purpose. Setting the theme from a React
      // effect shows the wrong colours for a frame first.
      try {
        var saved = localStorage.getItem('sift-theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
