<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sift — find the rows that are quietly ruining your model</title>
    <meta
      name="description"
      content="Sift audits any CSV for mislabelled rows, leaked features, train/test contamination and near-duplicates. Nothing is stored."
    />
    <meta property="og:title" content="Sift — dataset quality auditor" />
    <meta
      property="og:description"
      content="Fifteen checks for mislabelled rows, leaked features and train/test contamination. No API keys, nothing stored."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      // Inline and before paint on purpose. Setting the theme from a React
      // effect shows the wrong colours for a frame first.
      try {
        var saved = localStorage.getItem('sift-theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
